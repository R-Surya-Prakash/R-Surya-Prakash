<svg width="1200" height="315" viewBox="0 0 1200 315" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="315" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/><stop offset=".5" stop-color="#0B1424"/><stop offset="1" stop-color="#101027"/>
    </linearGradient>
    <linearGradient id="flow" x1="130" y1="0" x2="1060" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="315" rx="22" fill="url(#panel)"/>
  <rect x="1" y="1" width="1198" height="313" rx="21" stroke="#24334A" stroke-opacity=".8"/>

  <text x="70" y="65" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">SURYA / SYSTEM PIPELINE</text>
  <text x="70" y="100" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">From business problem to production workflow</text>

  <path d="M184 190H1015" stroke="#253349" stroke-width="4" stroke-linecap="round"/>
  <path d="M184 190H1015" stroke="url(#flow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="110 900" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="1010;0" dur="3.2s" repeatCount="indefinite"/>
  </path>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g>
      <circle cx="184" cy="190" r="34" fill="#0B2032" stroke="#38BDF8" stroke-width="2"/>
      <text x="184" y="196" fill="#38BDF8" font-size="18" text-anchor="middle">01</text>
      <text x="184" y="250" fill="#E2E8F0" font-size="14" text-anchor="middle">UNDERSTAND</text>
      <text x="184" y="272" fill="#64748B" font-size="11" text-anchor="middle">business domain</text>
    </g>
    <g>
      <circle cx="461" cy="190" r="34" fill="#1A1731" stroke="#A78BFA" stroke-width="2"/>
      <text x="461" y="196" fill="#A78BFA" font-size="18" text-anchor="middle">02</text>
      <text x="461" y="250" fill="#E2E8F0" font-size="14" text-anchor="middle">ENGINEER</text>
      <text x="461" y="272" fill="#64748B" font-size="11" text-anchor="middle">Frappe + ERPNext</text>
    </g>
    <g>
      <circle cx="738" cy="190" r="34" fill="#21162A" stroke="#F97316" stroke-width="2"/>
      <text x="738" y="196" fill="#F97316" font-size="18" text-anchor="middle">03</text>
      <text x="738" y="250" fill="#E2E8F0" font-size="14" text-anchor="middle">INTEGRATE</text>
      <text x="738" y="272" fill="#64748B" font-size="11" text-anchor="middle">API · SFTP · SAP</text>
    </g>
    <g>
      <circle cx="1015" cy="190" r="34" fill="#0B2824" stroke="#34D399" stroke-width="2">
        <animate attributeName="r" values="34;39;34" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="1015" y="196" fill="#34D399" font-size="18" text-anchor="middle">04</text>
      <text x="1015" y="250" fill="#E2E8F0" font-size="14" text-anchor="middle">AUTOMATE</text>
      <text x="1015" y="272" fill="#64748B" font-size="11" text-anchor="middle">ship + observe</text>
    </g>
  </g>
</svg>
